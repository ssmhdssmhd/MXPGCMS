{include file="public/include"}
{include file="public/head"}
<div class="mx-wrap">
    <div class="mx-crumb"><a href="{:mac_url('index/index')}">首页</a><span>/</span><span>专题</span></div>
    <section class="mx-section">
        <div class="mx-head"><h2>专题合集</h2></div>
        <div class="mx-topic-grid">
            {maccms:topic num="12" paging="yes" order="desc" by="time"}
            <div class="mx-topic-item">
                <a class="pic" href="{:mac_url_topic_detail($vo)}"><img src="{:mac_url_img($vo.topic_pic)}" alt="{$vo.topic_name}" loading="lazy" /></a>
                <p class="name"><a href="{:mac_url_topic_detail($vo)}">{$vo.topic_name}</a></p>
            </div>
            {/maccms:topic}
        </div>
        {include file="public/notempty"}
        {include file="public/paging"}
    </section>
</div>
{include file="public/foot"}
