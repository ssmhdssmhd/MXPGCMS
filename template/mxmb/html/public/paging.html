{if condition="!empty($__PAGING__['record_total']) && $__PAGING__['record_total'] gt 0"}
<div class="mx-pager">
    <a href="{$__PAGING__.page_url|mac_url_page=1}"{if $__PAGING__.page_current==1} class="disabled"{/if}>首页</a>
    <a href="{$__PAGING__.page_url|mac_url_page=$__PAGING__.page_prev}"{if $__PAGING__.page_current==1} class="disabled"{/if}>上一页</a>
    {maccms:foreach name="$__PAGING__.page_num" id="num"}
    <a href="{$__PAGING__.page_url|mac_url_page=$num}"{if $__PAGING__.page_current eq $num} class="active"{/if}>{$num}</a>
    {/maccms:foreach}
    <a href="{$__PAGING__.page_url|mac_url_page=$__PAGING__.page_next}"{if $__PAGING__.page_current==$__PAGING__.page_total} class="disabled"{/if}>下一页</a>
    <a href="{$__PAGING__.page_url|mac_url_page=$__PAGING__.page_total}"{if $__PAGING__.page_current==$__PAGING__.page_total} class="disabled"{/if}>尾页</a>
</div>
{/if}
